name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # [ADR-S3 + ADR-S4] Architectural Fitness Functions
  # Purpose: Convert ADR constraints from advisory documentation
  #          into executable CI gates that fail the build on violation.
  # ──────────────────────────────────────────────────────────────
  architectural-fitness:
    name: Architectural Fitness Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: '[ADR-S4] Enforce ADR-S2: DB::transaction only in app/Actions/'
        run: |
          echo "=== ADR-S2: Transaction Boundary Fitness Function ==="
          echo "Rule: DB::transaction() and DB::beginTransaction() MUST only appear in app/Actions/"
          echo "      Any occurrence outside app/Actions/ is an architectural violation."
          echo ""

          VIOLATIONS=$(grep -rn "DB::transaction\|DB::beginTransaction\|DB::commit\|DB::rollBack" \
            --include="*.php" app/ \
            | grep -v "^app/Actions/" \
            | grep -v "// ADR-S2: exception allowed" \
            | grep -v "# ADR-S2: exception allowed" \
            || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ ADR-S2 VIOLATION: DB::transaction found outside app/Actions/"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "Fix: Move transaction management into an Action class."
            echo "     If this is intentional, add '// ADR-S2: exception allowed' comment."
            exit 1
          fi
          echo "✅ ADR-S2 PASS: All transaction boundaries are within app/Actions/"

      - name: '[ADR-S3] Secret Scanner: detect committed secrets'
        run: |
          echo "=== ADR-S3: Secret Scanner ==="
          echo "Rule: No real APP_KEY values, API tokens, or passwords should be committed."
          echo ""

          # Check for committed .env with real content (not .env.example)
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ ADR-S3 VIOLATION: .env file is tracked by git."
            echo "   Run: git rm --cached .env && git commit -m 'fix: remove .env from git tracking'"
            exit 1
          fi

          # Check for committed sqlite files
          if git ls-files | grep -qE "database/.*\.sqlite"; then
            echo "❌ ADR-S3 VIOLATION: SQLite database file is tracked by git (contains PII risk)."
            echo "   Run: git rm --cached database/*.sqlite && git commit -m 'fix: remove sqlite from git tracking'"
            exit 1
          fi

          # Check for real-looking APP_KEY values in tracked PHP/env files
          HARDCODED_KEYS=$(git ls-files '*.php' '*.env*' 'config/*.php' \
            | xargs grep -l "APP_KEY=base64:" 2>/dev/null \
            | grep -v ".env.example" \
            | grep -v ".gitignore" \
            || true)

          if [ -n "$HARDCODED_KEYS" ]; then
            echo "❌ ADR-S3 VIOLATION: APP_KEY value found in tracked file(s):"
            echo "$HARDCODED_KEYS"
            exit 1
          fi

          # Check for hardcoded GOSHIP or other API tokens in PHP code
          HARDCODED_TOKENS=$(grep -rn "GOSHIP_TOKEN\s*=\s*['\"][^'\"]\+['\"]" \
            --include="*.php" app/ config/ \
            | grep -v "env(" \
            | grep -v "//" \
            || true)

          if [ -n "$HARDCODED_TOKENS" ]; then
            echo "❌ ADR-S3 VIOLATION: Hardcoded API token found (use env() instead):"
            echo "$HARDCODED_TOKENS"
            exit 1
          fi

          echo "✅ ADR-S3 PASS: No secrets detected in tracked files"

      - name: '[ADR-S3] Structural Trust Zone: Verify Restricted zone file patterns'
        run: |
          echo "=== ADR-S3: Restricted Zone Integrity ==="
          echo "Rule: Auth config, payment-adjacent code, and encryption keys"
          echo "      must not contain hardcoded credential values."
          echo ""

          # No hardcoded passwords in config/ files
          CONFIG_SECRETS=$(grep -rn "password\s*=>\s*['\"][^'\"]" \
            --include="*.php" config/ \
            | grep -v "env(" \
            | grep -v "//" \
            | grep -v "'password' => ''" \
            || true)

          if [ -n "$CONFIG_SECRETS" ]; then
            echo "❌ ADR-S3 VIOLATION: Possible hardcoded credential in config/:"
            echo "$CONFIG_SECRETS"
            exit 1
          fi

          echo "✅ ADR-S3 PASS: Restricted zone config files look clean"

      - name: '[ADR-S5] Vite Manifest Integrity: every viteTheme() entry must be built'
        run: |
          echo "=== ADR-S5: Vite Manifest Coverage ==="
          echo "Rule: Every CSS/JS path passed to viteTheme() or referenced by"
          echo "      FilamentView::registerRenderHook() must be registered in"
          echo "      vite.config.js input array, so the build produces a manifest entry."
          echo ""

          # Extract theme paths from PHP source
          THEME_PATHS=$(grep -rn "viteTheme\|registerRenderHook" \
            --include="*.php" app/ \
            | grep -oE "['\"][^'\"]*\.css['\"]" \
            | tr -d "'\"" \
            | grep -v "seller-panel.css" \
            | grep -v "seller-theme.css" \
            | sort -u \
            || true)

          if [ -z "$THEME_PATHS" ]; then
            echo "✅ ADR-S5 PASS: No viteTheme() calls found, nothing to verify"
            exit 0
          fi

          echo "Found viteTheme references:"
          echo "$THEME_PATHS"
          echo ""

          MISSING=0
          for path in $THEME_PATHS; do
            # Match either single or double quoted form by substring
            if grep -qF "$path" vite.config.js 2>/dev/null; then
              echo "  ✓ $path (registered in vite.config.js)"
            else
              echo "  ❌ $path NOT registered in vite.config.js input array"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "❌ ADR-S5 VIOLATION: $MISSING theme file(s) not in vite.config.js"
            echo "Fix: Add the missing CSS file to vite.config.js 'input' array,"
            echo "     then run 'npm run build' to regenerate public/build/manifest.json"
            echo "     (Failure to do so will cause 500 errors in production, which"
            echo "     some reverse proxies surface as 403 Forbidden to clients.)"
            exit 1
          fi

          echo "✅ ADR-S5 PASS: All viteTheme paths are registered in vite.config.js"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: architectural-fitness
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: laravel_test
          MYSQL_USER: laravel
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.4'
          # pdo_mysql added: tests now run against MySQL 8.0 (same as prod).
          # Previously used pdo_sqlite which silently no-ops lockForUpdate() — a
          # concurrency bug was undetectable. Remove sqlite/pdo_sqlite to enforce
          # production parity and catch InnoDB-specific behaviors in CI.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Run Tests (Pest/PHPUnit) against MySQL 8.0
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
        env:
          # Override to use the MySQL 8.0 service container (production parity).
          # lockForUpdate() and InnoDB row-level locking are now actually tested.
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: password

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/php/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          format: spdx-json
          output-file: sbom.spdx.json

      - name: '[SCA] Scan SBOM for vulnerabilities (blocks on critical/high CVEs)'
        uses: anchore/scan-action@3343887d815d7b07465f6fdcd395bd66508d486a # v4
        id: sca-scan
        with:
          sbom: sbom.spdx.json
          # Block the build on critical or high CVEs.
          # Medium/low are surfaced as warnings but do not fail the pipeline.
          # Rationale (ADR-S3): supply-chain security debt must not accumulate silently.
          fail-build: true
          severity-cutoff: high

      - name: Upload SCA scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.sca-scan.outputs.sarif }}

  deploy:
    name: Deploy to Homelab
    runs-on: [self-hosted, linux, x64]
    environment: production
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Environment Variables
        run: |
          echo "APP_ENV=production" > .env
          echo "APP_DEBUG=false" >> .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=${{ secrets.DB_DATABASE || 'laravel' }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME || 'laravel' }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "REDIS_HOST=redis" >> .env
          echo "REDIS_PASSWORD=null" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "APP_URL=https://demo.tanhdev.com" >> .env
          echo "SESSION_DOMAIN=.demo.tanhdev.com" >> .env
          echo "SESSION_DRIVER=redis" >> .env
          echo "CACHE_STORE=redis" >> .env
          echo "GHCR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main" >> .env

      - name: Login to GHCR (Self-Hosted Runner)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull Latest Images
        run: docker compose -f docker-compose.prod.yml pull

      - name: Deploy with Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d

      - name: Backup Database before Migration
        run: |
          echo "Dumping database before migration for rollback safety..."
          docker compose -f docker-compose.prod.yml exec -T db mysqldump -u${{ secrets.DB_USERNAME || 'laravel' }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_DATABASE || 'laravel' }} > backup_before_migrate.sql || true

      - name: Run Database Migrations
        run: docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

      - name: Generate Filament Shield Permissions
        run: docker compose -f docker-compose.prod.yml exec -T app php artisan shield:generate --all --panel=admin --ignore-existing-policies

      - name: Create Storage Symlink
        run: docker compose -f docker-compose.prod.yml exec -T app php artisan storage:link

      - name: Optimize and Cache
        run: |
          docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
          docker compose -f docker-compose.prod.yml exec -T app php artisan view:clear
          docker compose -f docker-compose.prod.yml exec -T app php artisan optimize

      - name: Clear Stale Application Cache Keys
        run: |
          echo "Clearing application-level cache keys that may have stale serialized data..."
          docker compose -f docker-compose.prod.yml exec -T app php artisan cache:forget provinces_list || true
          docker compose -f docker-compose.prod.yml exec -T app php artisan cache:forget provinces_list_v2 || true
          docker compose -f docker-compose.prod.yml exec -T app php artisan cache:forget provinces_list_v3 || true
          docker compose -f docker-compose.prod.yml exec -T app php artisan cache:forget provinces_list_v4 || true
          echo "Stale cache keys cleared."

      - name: Verify Deployment (Health Check)
        run: |
          echo "Waiting for Nginx to be ready..."
          sleep 5
          HTTP_STATUS=$(curl -L -o /dev/null -s -w "%{http_code}\n" http://localhost:8000)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed!"

      - name: Rollback Database on Failure
        if: failure()
        run: |
          echo "Deployment failed! Rolling back database..."
          if [ -f "backup_before_migrate.sql" ]; then
            docker compose -f docker-compose.prod.yml exec -T db mysql -u${{ secrets.DB_USERNAME || 'laravel' }} -p${{ secrets.DB_PASSWORD }} ${{ secrets.DB_DATABASE || 'laravel' }} < backup_before_migrate.sql
            echo "Database rollback complete."
          else
            echo "No database backup found, skipping database rollback."
          fi
